name: MERGE Living Museum life cycles

on:
  pull_request:
    branches: [main]
    paths:
      - "museum-site/**"
      - ".github/workflows/museum-life-cycles-ci.yml"
  workflow_dispatch:

jobs:
  museum-life-cycles:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Set up exact pnpm version
        run: |
          corepack enable
          corepack prepare pnpm@11.25.0 --activate
      - name: Install Museum dependencies
        working-directory: museum-site
        run: pnpm install --frozen-lockfile
      - name: Isolated life-cycle CORE gates test
        working-directory: museum-site
        run: node --experimental-strip-types scripts/test-life-cycle-2026.mjs
      - name: Life-cycle database migration and access-isolation checks
        working-directory: museum-site
        run: python3 scripts/test-life-cycle-db.py
      - name: Real private draft routes, identity, isolation and retry checks
        working-directory: museum-site
        run: node scripts/test-life-cycle-api.mjs
      - name: Twelve-design AI batch and selected revision contract tests
        working-directory: museum-site
        run: node --experimental-strip-types scripts/test-life-cycle-batch-2026.mjs
      - name: Revision storage and ownership tests
        working-directory: museum-site
        run: python3 scripts/test-life-cycle-revisions.py
      - name: TypeScript check
        working-directory: museum-site
        run: pnpm run typecheck
      - name: Existing CORE contract tests
        working-directory: museum-site
        run: pnpm run test:contracts
      - name: Build Museum
        working-directory: museum-site
        run: pnpm run build
      - name: Install browser test runtime
        working-directory: museum-site
        run: pnpm exec playwright install --with-deps chromium
      - name: Desktop and mobile private journey (offline API fixtures)
        working-directory: museum-site
        run: pnpm exec playwright test --config playwright.life-cycles.config.ts
      - name: Upload browser report and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: life-cycles-browser-evidence
          path: |
            museum-site/playwright-life-cycles-report/
            museum-site/test-results/life-cycles/
          if-no-files-found: ignore
